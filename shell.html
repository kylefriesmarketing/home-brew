<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>HOME BREW — a Smoky Mountain brewery tycoon</title>
<style>
:root{
  --chalk:#f4ead8; --board:#2c3a31; --tape:#e8d9a8; --amber:#e8a33d; --red:#b5472e;
  --ink:#241d14; --foam:#fff6e6; --green:#4c7a4c; --blue:#7e9bb2;
}
*{box-sizing:border-box; -webkit-user-select:none; user-select:none;}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#1a2420;
  font-family:Georgia,'Times New Roman',serif;}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;}
#ui{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
#ui .clickable{pointer-events:auto;cursor:pointer;}

/* ---------- chalkboard panels ---------- */
.board{background:linear-gradient(160deg,#33443a,#26332c 60%,#22302a);border:6px solid #6b4a2f;
  border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.55), inset 0 0 40px rgba(0,0,0,.35);
  color:var(--chalk);padding:14px 18px;}
.tape{position:relative;}
.tape::before{content:"";position:absolute;top:-12px;left:50%;transform:translateX(-50%) rotate(-2deg);
  width:90px;height:22px;background:var(--tape);opacity:.9;border-radius:2px;box-shadow:0 2px 4px rgba(0,0,0,.3);}
.chalkline{border:none;border-top:2px dashed rgba(244,234,216,.35);margin:8px 0;}
.btn{display:inline-block;background:var(--amber);color:var(--ink);border:3px solid #8a5a24;
  border-radius:8px;padding:7px 16px;font-weight:bold;font-size:16px;cursor:pointer;
  box-shadow:0 3px 0 #8a5a24;transform:rotate(-.5deg);}
.btn:hover{filter:brightness(1.08);transform:rotate(.4deg) scale(1.03);}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8a5a24;}
.btn.red{background:var(--red);color:var(--foam);border-color:#6e2517;box-shadow:0 3px 0 #6e2517;}
.btn.dim{opacity:.45;pointer-events:none;}
.btn.small{font-size:13px;padding:4px 10px;}

/* ---------- HUD ---------- */
#hud{position:absolute;top:10px;left:10px;display:flex;gap:10px;align-items:flex-start;}
.hudcard{background:rgba(36,29,20,.82);color:var(--foam);border:3px solid #6b4a2f;border-radius:8px;
  padding:6px 12px;font-size:17px;box-shadow:0 3px 8px rgba(0,0,0,.4);}
#hud-cash{color:#ffd98a;font-weight:bold;min-width:86px;}
#hud-day .ph{color:#ffd98a;}
#hud-fame{font-size:14px;}
#hud-fame .stars{color:#ffd98a;letter-spacing:2px;}
#hud-loan{color:#ff9d8a;display:none;}
#objectives{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
.obj{background:rgba(36,29,20,.8);color:var(--chalk);border-left:5px solid var(--amber);border-radius:6px;
  padding:5px 12px;font-size:14px;max-width:300px;transition:opacity .5s;}
.obj.done{opacity:.45;text-decoration:line-through;border-left-color:var(--green);}
#prompt{position:absolute;bottom:16%;left:50%;transform:translateX(-50%);
  background:rgba(36,29,20,.85);color:var(--foam);border:2px solid #6b4a2f;border-radius:8px;
  padding:7px 16px;font-size:17px;display:none;white-space:nowrap;}
#prompt b{color:#ffd98a;background:rgba(255,217,138,.14);border:1px solid #ffd98a;border-radius:5px;padding:0 7px;margin-right:7px;}
#toasts{position:absolute;top:64px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;}
.toast{background:rgba(36,29,20,.92);color:var(--foam);border:3px solid var(--amber);border-radius:8px;
  padding:8px 20px;font-size:17px;animation:toastIn .35s ease-out;box-shadow:0 4px 14px rgba(0,0,0,.5);text-align:center;}
.toast.bad{border-color:var(--red);}
.toast.gold{border-color:#ffd98a;background:rgba(90,60,10,.94);}
@keyframes toastIn{from{transform:translateY(-16px) scale(.9);opacity:0;}to{transform:none;opacity:1;}}

/* speech bubbles */
.bubble{position:absolute;transform:translate(-50%,-100%);background:var(--foam);color:var(--ink);
  border:3px solid var(--ink);border-radius:12px;padding:6px 12px;font-size:14px;max-width:230px;text-align:center;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.4));transition:opacity .3s;}
.bubble::after{content:"";position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);
  border:6px solid transparent;border-top-color:var(--ink);}
.bubble .who{display:block;font-weight:bold;color:var(--red);font-size:12px;}
.bubble.thought{border-style:dotted;border-radius:50%;padding:10px 16px;}

/* ---------- big overlays ---------- */
.overlay{position:absolute;inset:0;background:rgba(12,16,13,.72);display:flex;align-items:center;justify-content:center;
  pointer-events:auto;z-index:30;}
.panel{max-width:760px;min-width:420px;max-height:86vh;overflow-y:auto;}
.panel h1{font-size:30px;margin:0 0 4px;color:var(--foam);letter-spacing:1px;}
.panel h2{font-size:20px;margin:10px 0 4px;color:#ffd98a;}
.panel .sub{font-style:italic;opacity:.85;font-size:14px;}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 2px;font-size:16px;}
.row .nm{flex:1;}
.row .pr{color:#ffd98a;min-width:54px;text-align:right;}
.qty{display:inline-block;min-width:30px;text-align:center;color:#bfe0bf;}

/* gauges (boil minigame) */
#boilui{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:none;align-items:flex-end;gap:22px;}
.gauge{width:150px;text-align:center;color:var(--foam);}
.gauge .dial{position:relative;width:130px;height:74px;margin:0 auto;background:#f7ecd7;border:5px solid #503722;
  border-radius:130px 130px 0 0;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.5);}
.gauge .band{position:absolute;left:0;top:0;width:100%;height:100%;}
.gauge .needle{position:absolute;left:50%;bottom:-4px;width:5px;height:62px;background:#b5472e;transform-origin:50% 100%;
  border-radius:3px;box-shadow:0 0 3px rgba(0,0,0,.4);}
.gauge .lbl{font-size:15px;margin-top:4px;text-shadow:0 2px 3px #000;}
.gauge .key{font-size:12px;color:#ffd98a;}
#stirwrap{width:120px;color:var(--foam);text-align:center;}
#stirbar{width:110px;height:16px;border:3px solid #503722;background:#f7ecd7;border-radius:8px;margin:0 auto;overflow:hidden;}
#stirfill{height:100%;background:var(--green);width:60%;}
#boilevent{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);font-size:24px;color:#fff;
  background:rgba(181,71,46,.92);border-radius:10px;padding:8px 22px;display:none;font-weight:bold;
  animation:pulse .5s infinite alternate;}
@keyframes pulse{from{transform:translateX(-50%) scale(1);}to{transform:translateX(-50%) scale(1.07);}}
#boiltimer{position:absolute;left:50%;bottom:126px;transform:translateX(-50%);color:var(--foam);font-size:14px;display:none;}

/* title */
#title{background:rgba(10,14,11,.35);flex-direction:column;}
#title .logo{font-size:84px;font-weight:bold;color:var(--foam);letter-spacing:2px;line-height:.95;
  text-shadow:0 5px 0 #6b4a2f, 0 10px 24px rgba(0,0,0,.6);transform:rotate(-2deg);text-align:center;}
#title .logo .my{display:block;font-size:38px;color:var(--amber);letter-spacing:12px;}
#title .tag{color:var(--chalk);font-style:italic;margin:14px 0 26px;font-size:18px;text-align:center;text-shadow:0 2px 6px #000;}
#title .menu{display:flex;flex-direction:column;gap:12px;align-items:center;}
#title .credit{position:absolute;bottom:12px;width:100%;text-align:center;color:rgba(244,234,216,.75);font-size:13px;}
.bigfade{position:absolute;inset:0;background:#0b0e0c;opacity:0;pointer-events:none;transition:opacity .8s;z-index:40;}

/* tally / fair judge meters */
.meter{height:14px;background:#1d2822;border:2px solid #6b4a2f;border-radius:7px;overflow:hidden;margin:3px 0 8px;}
.meter i{display:block;height:100%;background:var(--amber);width:0%;transition:width .8s ease-out;}
.judge{display:flex;align-items:center;gap:10px;margin:6px 0;}
.judge .face{font-size:30px;width:42px;text-align:center;}
.judge .jm{flex:1;}

/* misc */
#vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 140px rgba(10,10,14,.55);}
#verchip{position:absolute;bottom:8px;left:10px;color:rgba(244,234,216,.4);font-size:11px;}
kbd{background:#3a3128;color:#ffd98a;border-radius:4px;border:1px solid #6b4a2f;padding:0 6px;font-family:inherit;}
.pricetag{display:inline-block;background:var(--tape);color:var(--ink);border-radius:4px;padding:2px 8px;font-weight:bold;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="vignette"></div>
  <div id="hud" style="display:none">
    <div class="hudcard" id="hud-cash">$0</div>
    <div class="hudcard" id="hud-day">Day 1 · <span class="ph">Morning</span></div>
    <div class="hudcard" id="hud-fame"><span class="rank">Roadside Shack</span><br><span class="stars"></span></div>
    <div class="hudcard" id="hud-loan">🐍 loan $0</div>
  </div>
  <div id="objectives"></div>
  <div id="toasts"></div>
  <div id="prompt"><b>E</b><span id="prompt-txt"></span></div>
  <div id="boilui">
    <div id="stirwrap"><div id="stirbar"><div id="stirfill"></div></div><div class="lbl">STIR <span class="key">tap S</span></div></div>
    <div class="gauge"><div class="dial"><canvas class="band" id="heatband" width="130" height="74"></canvas><div class="needle" id="heatneedle"></div></div><div class="lbl">HEAT <span class="key">hold F</span></div></div>
    <div class="gauge"><div class="dial"><canvas class="band" id="presband" width="130" height="74"></canvas><div class="needle" id="presneedle"></div></div><div class="lbl">PRESSURE <span class="key">hold SPACE</span></div></div>
  </div>
  <div id="boilevent"></div>
  <div id="boiltimer"></div>
  <div id="bubbles"></div>
  <div id="overlays"></div>
  <div id="title" class="overlay" style="display:none">
    <div class="logo"><span class="my">HOME</span>BREW</div>
    <div class="tag" id="titletag">one dirtbag · one hose · one dream</div>
    <div class="menu">
      <div class="btn" id="bt-continue" style="display:none">▶ &nbsp;Continue — Day <span id="bt-day"></span></div>
      <div class="btn" id="bt-new">🍺 &nbsp;New Brewery</div>
      <div class="btn small" id="bt-how">❓ how to play</div>
    </div>
    <div class="credit">a Dirty Boy Devs joint · The Room</div>
  </div>
  <div class="bigfade" id="fade"></div>
  <div id="verchip">home brew v1.8</div>
</div>
<script>/*__THREE__*/</script>
<!--__PARTS__-->
</body>
</html>
